<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">compute_at：把缓存搬运放到需要它的循环内</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">compute_at：把缓存搬运放到需要它的循环内</text><rect x="24" y="80" width="420" height="295" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="109" font-size="18" fill="#24364b" xml:space="preserve">搬运在循环外：缓存整个 A</text><text x="45" y="140" font-size="18" fill="#24364b" xml:space="preserve">把 A[0:32,0:32] 搬到缓存</text><text x="45" y="166" font-size="18" fill="#24364b" xml:space="preserve">for i</text><text x="45" y="192" font-size="18" fill="#24364b" xml:space="preserve">  for jo</text><text x="45" y="218" font-size="18" fill="#24364b" xml:space="preserve">    for k</text><text x="45" y="244" font-size="18" fill="#24364b" xml:space="preserve">      for ji in 0..7</text><text x="45" y="270" font-size="18" fill="#24364b" xml:space="preserve">        计算 C[i,8*jo+ji]</text><rect x="510" y="80" width="420" height="295" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="524" y="109" font-size="18" fill="#24364b" xml:space="preserve">搬运移入 k：每次准备一个元素</text><text x="530" y="140" font-size="18" fill="#24364b" xml:space="preserve">for i</text><text x="530" y="166" font-size="18" fill="#24364b" xml:space="preserve">  for jo</text><text x="530" y="192" font-size="18" fill="#24364b" xml:space="preserve">    for k</text><text x="530" y="218" font-size="18" fill="#24364b" xml:space="preserve">      搬 A[i,k] 到 A_global[i,k]</text><text x="530" y="244" font-size="18" fill="#24364b" xml:space="preserve">      for ji in 0..7</text><text x="530" y="270" font-size="18" fill="#24364b" xml:space="preserve">        读取刚准备的缓存</text><path d="M445 225 L510 225" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="424" font-size="17" fill="#24364b" xml:space="preserve">固定 i、jo、k 后，八个消费者共用 A[i,k]。图示对应本章宽度 8 的调度。</text><text x="24" y="455" font-size="17" fill="#24364b" xml:space="preserve">搬运范围由消费者访问推导；是否减小缓存分配，还要看后续存储处理。</text></g></svg>
