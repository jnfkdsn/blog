<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">自动调度：测量结果用于选择下一份程序</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">自动调度：测量结果用于选择下一份程序</text><rect x="24" y="85" width="252" height="90" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="114" font-size="18" fill="#24364b" xml:space="preserve">候选调度</text><text x="38" y="140" font-size="18" fill="#24364b" xml:space="preserve">分块、缓存、并行等</text><rect x="350" y="85" width="252" height="90" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="114" font-size="18" fill="#24364b" xml:space="preserve">构建目标实现</text><text x="364" y="140" font-size="18" fill="#24364b" xml:space="preserve">编译候选程序</text><rect x="680" y="85" width="252" height="90" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="114" font-size="18" fill="#24364b" xml:space="preserve">在目标上测量</text><text x="694" y="140" font-size="18" fill="#24364b" xml:space="preserve">记录运行时间与条件</text><path d="M276 130 L350 130" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M602 130 L680 130" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="280" width="320" height="90" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="309" font-size="18" fill="#24364b" xml:space="preserve">测量数据库</text><text x="364" y="335" font-size="18" fill="#24364b" xml:space="preserve">workload + target + 记录</text><path d="M806 175 V326 H670" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 326 H150 V175" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="270" font-size="17" fill="#24364b" xml:space="preserve">搜索据此选择</text><text x="28" y="296" font-size="17" fill="#24364b" xml:space="preserve">新的候选</text><text x="24" y="418" font-size="17" fill="#24364b" xml:space="preserve">构建/查询数据库与模型执行是不同阶段；命中记录后通常直接复用选定调度。</text></g></svg>
