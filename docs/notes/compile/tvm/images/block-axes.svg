<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">TensorIR：循环坐标绑定到计算块的轴</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">TensorIR：循环坐标绑定到计算块的轴</text><rect x="24" y="80" width="290" height="90" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="109" font-size="18" fill="#24364b" xml:space="preserve">外层循环</text><text x="38" y="135" font-size="18" fill="#24364b" xml:space="preserve">i、j、k</text><rect x="400" y="80" width="530" height="90" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="414" y="109" font-size="18" fill="#24364b" xml:space="preserve">Block C：vi=i，vj=j，vk=k</text><text x="414" y="135" font-size="18" fill="#24364b" xml:space="preserve">轴类型：S、S、R</text><path d="M314 125 L400 125" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="357.0" y="113" font-size="16" text-anchor="middle">绑定</text><rect x="24" y="250" width="290" height="100" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="279" font-size="18" fill="#24364b" xml:space="preserve">每个输出的初始化</text><text x="38" y="305" font-size="18" fill="#24364b" xml:space="preserve">C[vi,vj] = 0</text><text x="38" y="331" font-size="18" fill="#24364b" xml:space="preserve">不随 vk 重复清零</text><rect x="400" y="250" width="530" height="100" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="414" y="279" font-size="18" fill="#24364b" xml:space="preserve">一次更新</text><text x="414" y="305" font-size="18" fill="#24364b" xml:space="preserve">C[vi,vj] += A[vi,vk] × B[vk,vj]</text><text x="414" y="331" font-size="18" fill="#24364b" xml:space="preserve">vk 改变时仍累加到同一输出</text><path d="M665 170 L665 250" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="675.0" y="201.0" font-size="16" fill="#24364b" xml:space="preserve">索引表达式</text><path d="M314 300 L400 300" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="409" font-size="17" fill="#24364b" xml:space="preserve">Schedule 可改变外层循环及轴绑定；计算块继续描述输出、归约与读写关系。</text></g></svg>
