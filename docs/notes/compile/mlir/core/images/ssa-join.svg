<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">SSA 的合流值由实际进入的控制流边提供</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">SSA 的合流值由实际进入的控制流边提供</text><rect x="350" y="70" width="250" height="65" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="99" font-size="18" fill="#24364b" xml:space="preserve">entry：定义 %x</text><rect x="24" y="200" width="330" height="75" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="229" font-size="18" fill="#24364b" xml:space="preserve">then：%a = addi %x, 1</text><rect x="600" y="200" width="330" height="75" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="614" y="229" font-size="18" fill="#24364b" xml:space="preserve">else：%b = subi %x, 1</text><path d="M410 135 L190 200" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 135 L765 200" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="340" width="250" height="65" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="369" font-size="18" fill="#24364b" xml:space="preserve">join(%v)：使用 %v</text><path d="M190 275 L350 355" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="280.0" y="306.0" font-size="16" fill="#24364b" xml:space="preserve">传入 %a</text><path d="M765 275 L600 355" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="692.5" y="306.0" font-size="16" fill="#24364b" xml:space="preserve">传入 %b</text><text x="24" y="429" font-size="16" fill="#24364b" xml:space="preserve">%x 可在两边使用；%a 只在 then 路径定义，不能越过另一条路径直接成为合流值。</text></g></svg>
