<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">输出行在不同时刻保存不同内容</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">输出行在不同时刻保存不同内容</text><rect x="24" y="100" width="250" height="115" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="129" font-size="18" fill="#24364b" xml:space="preserve">第 1 遍：求 max</text><text x="38" y="155" font-size="18" fill="#24364b" xml:space="preserve">Out 尚无最终内容</text><rect x="350" y="100" width="250" height="115" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="129" font-size="18" fill="#24364b" xml:space="preserve">第 2 遍：计算 exp</text><text x="364" y="155" font-size="18" fill="#24364b" xml:space="preserve">Out 保存 E</text><text x="364" y="181" font-size="18" fill="#24364b" xml:space="preserve">同时累加 sum</text><rect x="680" y="100" width="250" height="115" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="129" font-size="18" fill="#24364b" xml:space="preserve">第 3 遍：归一化</text><text x="694" y="155" font-size="18" fill="#24364b" xml:space="preserve">Out 保存 E / sum</text><text x="694" y="181" font-size="18" fill="#24364b" xml:space="preserve">返回最终结果</text><path d="M274 157 L350 157" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 157 L680 157" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="275" width="905" height="65" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="304" font-size="18" fill="#24364b" xml:space="preserve">第 2、3 遍使用同一份 Out 存储；调用者只在返回后观察最终概率。</text><text x="24" y="373" font-size="18" fill="#24364b" xml:space="preserve">若 E 也是必须返回的结果，就不能把唯一一份 E 覆盖成概率。</text></g></svg>
