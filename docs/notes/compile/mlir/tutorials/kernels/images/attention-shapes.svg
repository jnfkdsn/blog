<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Attention 的形状与中间值</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">Attention 的形状与中间值</text><rect x="24" y="85" width="250" height="105" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="114" font-size="18" fill="#24364b" xml:space="preserve">Q：M×D</text><text x="38" y="140" font-size="18" fill="#24364b" xml:space="preserve">K：N×D</text><text x="38" y="166" font-size="18" fill="#24364b" xml:space="preserve">scale × QKᵀ</text><rect x="350" y="85" width="250" height="105" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="114" font-size="18" fill="#24364b" xml:space="preserve">S：M×N</text><text x="364" y="140" font-size="18" fill="#24364b" xml:space="preserve">每个 query 对所有 key</text><text x="364" y="166" font-size="18" fill="#24364b" xml:space="preserve">的分数</text><rect x="680" y="85" width="250" height="105" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="114" font-size="18" fill="#24364b" xml:space="preserve">W：M×N</text><text x="694" y="140" font-size="18" fill="#24364b" xml:space="preserve">沿 key 归一化</text><text x="694" y="166" font-size="18" fill="#24364b" xml:space="preserve">每行权重之和为 1</text><path d="M274 138 L350 138" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 138 L680 138" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="640.0" y="126" font-size="16" text-anchor="middle">softmax</text><rect x="350" y="290" width="250" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="319" font-size="18" fill="#24364b" xml:space="preserve">V：N×P</text><text x="364" y="345" font-size="18" fill="#24364b" xml:space="preserve">每个 key 对应的 value</text><rect x="680" y="290" width="250" height="80" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="319" font-size="18" fill="#24364b" xml:space="preserve">O = WV：M×P</text><text x="694" y="345" font-size="18" fill="#24364b" xml:space="preserve">按权重合并 value</text><path d="M805 190 L805 290" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 330 L680 330" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="425" font-size="17" fill="#24364b" xml:space="preserve">图展示数学依赖；实现可复用 S/W 的存储，也可用在线状态避免完整保存它们。</text></g></svg>
