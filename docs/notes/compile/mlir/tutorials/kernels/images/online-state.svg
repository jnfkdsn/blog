<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">在线 Attention：新块合并到三个持续状态</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">在线 Attention：新块合并到三个持续状态</text><rect x="24" y="85" width="250" height="100" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="114" font-size="18" fill="#24364b" xml:space="preserve">旧状态</text><text x="38" y="140" font-size="18" fill="#24364b" xml:space="preserve">m：旧最大值</text><text x="38" y="166" font-size="18" fill="#24364b" xml:space="preserve">l、u：旧基准下的总量</text><rect x="680" y="85" width="250" height="100" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="114" font-size="18" fill="#24364b" xml:space="preserve">新 key/value 块</text><text x="694" y="140" font-size="18" fill="#24364b" xml:space="preserve">sⱼ、vⱼ</text><text x="694" y="166" font-size="18" fill="#24364b" xml:space="preserve">b = max(sⱼ)</text><rect x="330" y="220" width="300" height="100" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="344" y="249" font-size="18" fill="#24364b" xml:space="preserve">共同基准 m′ = max(m,b)</text><text x="344" y="275" font-size="18" fill="#24364b" xml:space="preserve">α = exp(m−m′)</text><text x="344" y="301" font-size="18" fill="#24364b" xml:space="preserve">pⱼ = exp(sⱼ−m′)</text><path d="M150 185 L350 220" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 185 L610 220" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="370" width="600" height="75" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="344" y="399" font-size="18" fill="#24364b" xml:space="preserve">l′ = αl + Σpⱼ；u′ = αu + Σpⱼvⱼ</text><text x="344" y="425" font-size="18" fill="#24364b" xml:space="preserve">全部有效块处理完后，输出 u′ / l′</text><path d="M480 320 L480 370" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M330 407 H145 V185" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="310" font-size="17" fill="#24364b" xml:space="preserve">下一块使用</text><text x="25" y="336" font-size="17" fill="#24364b" xml:space="preserve">m′、l′、u′</text></g></svg>
