"37" height="37" fill="#ffe9c7" stroke="white" stroke-width="2"/><rect x="700" y="179" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="737" y="179" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="774" y="179" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="811" y="179" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="700" y="216" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="737" y="216" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="774" y="216" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="811" y="216" width="37" height="37" fill="#f0f3f7" stroke="white" stroke-width="2"/><rect x="315" y="360" width="335" height="60" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="329" y="389" font-size="18" fill="#24364b" xml:space="preserve">C 块 += A 块 × B 块</text><path d="M135 253 V390 H315" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 327 L430 360" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 390 H774 V255" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="452" font-size="18" fill="#24364b" xml:space="preserve">彩色 A、B 块沿 K 同步移动；橙色 C 块保留前面所有 K 块的部分和。</text><text x="24" y="482" font-size="17" fill="#24364b" xml:space="preserve">示意划分只显示矩阵坐标；分块后是否进入快存储，要由后续调度和搬运决定。</text></g></svg>
