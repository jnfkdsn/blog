<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">数据流分析合并的是所有可达路径上的事实</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">数据流分析合并的是所有可达路径上的事实</text><rect x="24" y="90" width="180" height="65" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="119" font-size="18" fill="#24364b" xml:space="preserve">then：3 + 4 = 7</text><rect x="250" y="90" width="180" height="65" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="264" y="119" font-size="18" fill="#24364b" xml:space="preserve">else：7</text><rect x="90" y="255" width="300" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="104" y="284" font-size="18" fill="#24364b" xml:space="preserve">合流结果</text><text x="104" y="310" font-size="18" fill="#24364b" xml:space="preserve">常量 7</text><path d="M114 155 L170 255" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 155 L305 255" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="504" y="90" width="180" height="65" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="518" y="119" font-size="18" fill="#24364b" xml:space="preserve">then：3 + 4 = 7</text><rect x="730" y="90" width="180" height="65" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="744" y="119" font-size="18" fill="#24364b" xml:space="preserve">else：8</text><rect x="570" y="255" width="300" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="584" y="284" font-size="18" fill="#24364b" xml:space="preserve">合流结果</text><text x="584" y="310" font-size="18" fill="#24364b" xml:space="preserve">不能确定单个常量</text><path d="M594 155 L650 255" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 155 L785 255" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="388" font-size="18" fill="#24364b" xml:space="preserve">左右是两份不同的程序；条件未知时，分析必须考虑每条可达路径。</text></g></svg>
