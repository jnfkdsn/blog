<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Region 中的包含关系与传值</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">Region 中的包含关系与传值</text><rect x="24" y="65" width="912" height="390" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="94" font-size="18" fill="#24364b" xml:space="preserve">func.func @clip_inside</text><rect x="230" y="115" width="470" height="315" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="244" y="144" font-size="18" fill="#24364b" xml:space="preserve">my.scope 操作</text><rect x="250" y="160" width="430" height="250" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="264" y="189" font-size="18" fill="#24364b" xml:space="preserve">body Region</text><rect x="270" y="205" width="390" height="185" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="284" y="234" font-size="18" fill="#24364b" xml:space="preserve">入口 Block ^bb0</text><text x="45" y="270" font-size="18" fill="#24364b" xml:space="preserve">%x = 12</text><path d="M145 265 L278 265" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="211.5" y="253" font-size="16" text-anchor="middle">按位置绑定</text><text x="295" y="274" font-size="18" fill="#24364b" xml:space="preserve">%local = 12</text><path d="M410 284 L410 307" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="330" font-size="18" fill="#24364b" xml:space="preserve">my.clamp → %clipped = 7</text><text x="295" y="370" font-size="18" fill="#24364b" xml:space="preserve">my.yield %clipped</text><path d="M660 365 L760 365" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="710.0" y="353" font-size="16" text-anchor="middle">结果</text><text x="770" y="373" font-size="18" fill="#24364b" xml:space="preserve">%r = 7</text><text x="30" y="489" font-size="18" fill="#24364b" xml:space="preserve">框表示包含；箭头表示 my.scope 约定的值传递。不是函数调用图。</text></g></svg>
