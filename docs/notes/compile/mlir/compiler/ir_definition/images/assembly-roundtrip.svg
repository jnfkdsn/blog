<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">两种文本写法，对应同一份 IR 对象</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">两种文本写法，对应同一份 IR 对象</text><rect x="25" y="85" width="325" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="39" y="114" font-size="18" fill="#24364b" xml:space="preserve">%r = my.add %a, %b : i32</text><rect x="25" y="220" width="325" height="98" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="39" y="249" font-size="18" fill="#24364b" xml:space="preserve">&quot;my.add&quot;(%a, %b)</text><text x="39" y="275" font-size="18" fill="#24364b" xml:space="preserve">: (i32, i32) -&gt; i32</text><rect x="550" y="130" width="380" height="150" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="564" y="159" font-size="18" fill="#24364b" xml:space="preserve">Operation：my.add</text><text x="564" y="185" font-size="18" fill="#24364b" xml:space="preserve">operands：引用 %a、%b</text><text x="564" y="211" font-size="18" fill="#24364b" xml:space="preserve">result type：i32</text><text x="564" y="237" font-size="18" fill="#24364b" xml:space="preserve">result：一个 SSA Value</text><path d="M350 110 L548 160" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="459.0" y="126.0" font-size="16" fill="#24364b" xml:space="preserve">parser</text><path d="M350 245 L548 240" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="459.0" y="233.5" font-size="16" fill="#24364b" xml:space="preserve">parser</text><path d="M740 130 V65 H180 V83" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="440" y="58" font-size="16" fill="#24364b" xml:space="preserve">printer 选择一种文本格式</text><text x="30" y="356" font-size="18" fill="#24364b" xml:space="preserve">parser 从文本构造 IR 对象，printer 将同一份对象输出为所选文本格式。</text></g></svg>
