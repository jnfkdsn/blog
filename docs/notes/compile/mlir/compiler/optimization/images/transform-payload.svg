<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Transform 句柄关联编译器对象，payload 值描述目标计算</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">Transform 句柄关联编译器对象，payload 值描述目标计算</text><rect x="24" y="85" width="410" height="250" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="114" font-size="18" fill="#24364b" xml:space="preserve">调度 IR（编译时解释）</text><rect x="520" y="85" width="410" height="250" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="534" y="114" font-size="18" fill="#24364b" xml:space="preserve">payload IR（随后生成计算代码）</text><text x="45" y="160" font-size="18" fill="#24364b" xml:space="preserve">%target：操作集合的句柄</text><text x="545" y="160" font-size="18" fill="#24364b" xml:space="preserve">linalg.generic</text><path d="M330 155 L535 155" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="432.5" y="143" font-size="16" text-anchor="middle">关联</text><text x="45" y="235" font-size="18" fill="#24364b" xml:space="preserve">tile → 新句柄</text><text x="545" y="235" font-size="18" fill="#24364b" xml:space="preserve">scf.for + 块内 generic</text><path d="M330 230 L535 230" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="432.5" y="218" font-size="16" text-anchor="middle">变换</text><text x="545" y="300" font-size="18" fill="#24364b" xml:space="preserve">%x、%y：计算的数据值</text><text x="24" y="380" font-size="16" fill="#24364b" xml:space="preserve">修改 payload 后，旧句柄是否还能使用，取决于该 Transform 操作的消费与失效规则。</text></g></svg>
