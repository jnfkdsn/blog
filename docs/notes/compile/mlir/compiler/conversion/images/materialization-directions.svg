<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">部分转换中的两种边界方向</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">部分转换中的两种边界方向</text><text x="24" y="86" font-size="18" fill="#24364b" xml:space="preserve">旧消费者仍要原类型：source materialization</text><rect x="24" y="105" width="252" height="80" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="134" font-size="18" fill="#24364b" xml:space="preserve">新生产者</text><text x="38" y="160" font-size="18" fill="#24364b" xml:space="preserve">i32</text><rect x="350" y="105" width="252" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="134" font-size="18" fill="#24364b" xml:space="preserve">边界操作</text><text x="364" y="160" font-size="18" fill="#24364b" xml:space="preserve">i32 → range</text><rect x="680" y="105" width="252" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="134" font-size="18" fill="#24364b" xml:space="preserve">旧消费者</text><text x="694" y="160" font-size="18" fill="#24364b" xml:space="preserve">需要 range</text><path d="M276 145 L350 145" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M602 145 L680 145" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="238" font-size="18" fill="#24364b" xml:space="preserve">新消费者要目标类型：target materialization</text><rect x="24" y="257" width="252" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="286" font-size="18" fill="#24364b" xml:space="preserve">旧生产者</text><text x="38" y="312" font-size="18" fill="#24364b" xml:space="preserve">range</text><rect x="350" y="257" width="252" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="286" font-size="18" fill="#24364b" xml:space="preserve">边界操作</text><text x="364" y="312" font-size="18" fill="#24364b" xml:space="preserve">range → i32</text><rect x="680" y="257" width="252" height="80" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="286" font-size="18" fill="#24364b" xml:space="preserve">新消费者</text><text x="694" y="312" font-size="18" fill="#24364b" xml:space="preserve">需要 i32</text><path d="M276 297 L350 297" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M602 297 L680 297" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="377" font-size="17" fill="#24364b" xml:space="preserve">箭头表示 SSA 值的衔接；占位 cast 记录关系，具体语义仍需后续实现。</text></g></svg>
