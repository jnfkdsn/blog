<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">类型转换需要同时处理产生值与使用值的位置</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">类型转换需要同时处理产生值与使用值的位置</text><text x="40" y="82" font-size="18" fill="#24364b" xml:space="preserve">转换前</text><text x="530" y="82" font-size="18" fill="#24364b" xml:space="preserve">转换后</text><rect x="24" y="105" width="415" height="65" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="134" font-size="18" fill="#24364b" xml:space="preserve">函数结果类型：!my.range&lt;-4,7&gt;</text><rect x="520" y="105" width="415" height="65" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="534" y="134" font-size="18" fill="#24364b" xml:space="preserve">函数结果类型：i32</text><path d="M439 137 L520 137" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="205" width="415" height="65" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="234" font-size="18" fill="#24364b" xml:space="preserve">my.limit → %r : !my.range&lt;-4,7&gt;</text><rect x="520" y="205" width="415" height="65" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="534" y="234" font-size="18" fill="#24364b" xml:space="preserve">maxsi / minsi → %new : i32</text><path d="M439 237 L520 237" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="305" width="415" height="65" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="334" font-size="18" fill="#24364b" xml:space="preserve">return %r : !my.range&lt;-4,7&gt;</text><rect x="520" y="305" width="415" height="65" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="534" y="334" font-size="18" fill="#24364b" xml:space="preserve">return %new : i32</text><path d="M439 337 L520 337" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="415" font-size="17" fill="#24364b" xml:space="preserve">TypeConverter 提供类型规则；各操作 Pattern 创建/替换 IR，并由框架维护值映射。</text></g></svg>
