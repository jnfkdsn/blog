<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">从 Pass 调度到一次规则应用</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">从 Pass 调度到一次规则应用</text><rect x="24" y="75" width="200" height="85" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="104" font-size="18" fill="#24364b" xml:space="preserve">PassManager</text><text x="38" y="130" font-size="18" fill="#24364b" xml:space="preserve">运行 pipeline</text><rect x="270" y="75" width="220" height="85" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="284" y="104" font-size="18" fill="#24364b" xml:space="preserve">Pass::runOnOperation</text><text x="284" y="130" font-size="18" fill="#24364b" xml:space="preserve">准备规则集</text><rect x="540" y="75" width="390" height="85" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="554" y="104" font-size="18" fill="#24364b" xml:space="preserve">driver：选择候选 Operation</text><text x="554" y="130" font-size="18" fill="#24364b" xml:space="preserve">按根操作类型筛选候选规则</text><path d="M224 115 L270 115" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 115 L540 115" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="225" width="390" height="85" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="554" y="254" font-size="18" fill="#24364b" xml:space="preserve">Pattern::matchAndRewrite</text><text x="554" y="280" font-size="18" fill="#24364b" xml:space="preserve">检查条件 → 请求修改</text><path d="M735 160 L735 225" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="745.0" y="183.5" font-size="16" fill="#24364b" xml:space="preserve">调用</text><rect x="24" y="225" width="430" height="85" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="254" font-size="18" fill="#24364b" xml:space="preserve">PatternRewriter</text><text x="38" y="280" font-size="18" fill="#24364b" xml:space="preserve">改引用、替换/删除操作；通知 driver</text><path d="M540 267 L454 267" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M238 310 V350 H947 V115 H932" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="280" y="380" font-size="17" fill="#24364b" xml:space="preserve">driver 根据通知维护状态，再选择候选</text><text x="28" y="432" font-size="18" fill="#24364b" xml:space="preserve">规则的构造/注册不会执行改写；是 driver 调用 matchAndRewrite。</text><text x="28" y="462" font-size="18" fill="#24364b" xml:space="preserve">是否回访操作、何时结束，取决于具体 driver。</text></g></svg>
