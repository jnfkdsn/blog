<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">所有权是释放责任，借用是暂时访问</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">所有权是释放责任，借用是暂时访问</text><text x="24" y="82" font-size="18" fill="#24364b" xml:space="preserve">借用参数：释放责任留在调用者</text><rect x="24" y="105" width="250" height="70" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="134" font-size="18" fill="#24364b" xml:space="preserve">调用者：alloc 得到 b</text><rect x="350" y="105" width="255" height="70" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="134" font-size="18" fill="#24364b" xml:space="preserve">被调用函数：读/写 b</text><rect x="680" y="105" width="250" height="70" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="134" font-size="18" fill="#24364b" xml:space="preserve">调用者：最后使用后释放</text><path d="M274 140 L350 140" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="312.0" y="128" font-size="16" text-anchor="middle">借用</text><path d="M605 140 L680 140" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="642.5" y="128" font-size="16" text-anchor="middle">返回</text><text x="24" y="235" font-size="18" fill="#24364b" xml:space="preserve">返回新分配结果：释放责任随结果交出</text><rect x="24" y="260" width="250" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="289" font-size="18" fill="#24364b" xml:space="preserve">make：alloc 得到 b</text><text x="38" y="315" font-size="18" fill="#24364b" xml:space="preserve">return b</text><rect x="350" y="260" width="255" height="80" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="289" font-size="18" fill="#24364b" xml:space="preserve">consume 接收 b</text><text x="364" y="315" font-size="18" fill="#24364b" xml:space="preserve">继续使用它</text><rect x="680" y="260" width="250" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="289" font-size="18" fill="#24364b" xml:space="preserve">consume：最后使用后</text><text x="694" y="315" font-size="18" fill="#24364b" xml:space="preserve">释放 b</text><path d="M274 300 L350 300" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="312.0" y="288" font-size="16" text-anchor="middle">交出</text><path d="M605 300 L680 300" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="402" font-size="17" fill="#24364b" xml:space="preserve">同一片存储可以有多个视图；不能因此重复释放，也不能在仍有访问时提前释放。</text></g></svg>
