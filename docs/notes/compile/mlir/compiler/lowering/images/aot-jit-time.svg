<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">AOT 与 JIT：编译发生的时间不同</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">AOT 与 JIT：编译发生的时间不同</text><text x="24" y="83" font-size="18" fill="#24364b" xml:space="preserve">AOT：部署前编译</text><text x="24" y="242" font-size="18" fill="#24364b" xml:space="preserve">JIT：应用运行期间准备代码</text><rect x="24" y="105" width="252" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="134" font-size="18" fill="#24364b" xml:space="preserve">编译器</text><text x="38" y="160" font-size="18" fill="#24364b" xml:space="preserve">IR → 机器码</text><rect x="350" y="105" width="252" height="80" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="134" font-size="18" fill="#24364b" xml:space="preserve">产物</text><text x="364" y="160" font-size="18" fill="#24364b" xml:space="preserve">对象文件 / 库</text><rect x="680" y="105" width="252" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="134" font-size="18" fill="#24364b" xml:space="preserve">应用启动与调用</text><text x="694" y="160" font-size="18" fill="#24364b" xml:space="preserve">装载、解析符号、执行</text><path d="M276 145 L350 145" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M602 145 L680 145" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="265" width="252" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="294" font-size="18" fill="#24364b" xml:space="preserve">运行中的宿主</text><text x="38" y="320" font-size="18" fill="#24364b" xml:space="preserve">请求一份实现</text><rect x="350" y="265" width="252" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="294" font-size="18" fill="#24364b" xml:space="preserve">JIT 编译与链接</text><text x="364" y="320" font-size="18" fill="#24364b" xml:space="preserve">生成可调用代码</text><rect x="680" y="265" width="252" height="80" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="294" font-size="18" fill="#24364b" xml:space="preserve">宿主调用函数</text><text x="694" y="320" font-size="18" fill="#24364b" xml:space="preserve">以后可复用已有代码</text><path d="M276 305 L350 305" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M602 305 L680 305" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="392" font-size="18" fill="#24364b" xml:space="preserve">编译产生实现；装载/链接让实现可寻址；调用才用实际输入执行计算。</text></g></svg>
