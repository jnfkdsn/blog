<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">同一个 MemRef 参数，降低后按描述符字段传递</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">同一个 MemRef 参数，降低后按描述符字段传递</text><rect x="24" y="75" width="250" height="95" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="104" font-size="18" fill="#24364b" xml:space="preserve">caller</text><text x="38" y="130" font-size="18" fill="#24364b" xml:space="preserve">%window : memref&lt;...&gt;</text><rect x="680" y="75" width="250" height="95" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="104" font-size="18" fill="#24364b" xml:space="preserve">read2d</text><text x="694" y="130" font-size="18" fill="#24364b" xml:space="preserve">参数 %m : memref&lt;...&gt;</text><path d="M274 120 L680 120" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="477.0" y="108" font-size="16" text-anchor="middle">高层调用：一个 MemRef 参数</text><rect x="24" y="235" width="250" height="90" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="264" font-size="18" fill="#24364b" xml:space="preserve">降低后的 caller</text><text x="38" y="290" font-size="18" fill="#24364b" xml:space="preserve">准备低层实参</text><rect x="350" y="215" width="255" height="130" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="364" y="244" font-size="18" fill="#24364b" xml:space="preserve">allocated、aligned</text><text x="364" y="270" font-size="18" fill="#24364b" xml:space="preserve">offset</text><text x="364" y="296" font-size="18" fill="#24364b" xml:space="preserve">size0、size1</text><text x="364" y="322" font-size="18" fill="#24364b" xml:space="preserve">stride0、stride1</text><rect x="680" y="235" width="250" height="90" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="264" font-size="18" fill="#24364b" xml:space="preserve">降低后的 read2d</text><text x="694" y="290" font-size="18" fill="#24364b" xml:space="preserve">重建描述与计算地址</text><path d="M150 170 L150 235" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 170 L805 235" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M274 280 L350 280" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 280 L680 280" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="380" font-size="16" fill="#24364b" xml:space="preserve">图中省略索引 i、j；字段描述存储，并不复制整个数组。C wrapper 是另一个适配入口。</text></g></svg>
