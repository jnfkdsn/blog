<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc"><title id="title">Reshape 与转置：同样的形状，不同的元素对应</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">Reshape 与转置：同样的形状，不同的元素对应</text><text x="24" y="85" font-size="18" fill="#24364b" xml:space="preserve">A：2×3</text><rect x="24" y="105" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="33" y="138.8" font-size="16" fill="#24364b" xml:space="preserve">1</text><rect x="76" y="105" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="85" y="138.8" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="128" y="105" width="52" height="52" fill="#d9e9ff" stroke="white" stroke-width="2"/><text x="137" y="138.8" font-size="16" fill="#24364b" xml:space="preserve">3</text><rect x="24" y="157" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="33" y="190.8" font-size="16" fill="#24364b" xml:space="preserve">4</text><rect x="76" y="157" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="85" y="190.8" font-size="16" fill="#24364b" xml:space="preserve">5</text><rect x="128" y="157" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="137" y="190.8" font-size="16" fill="#24364b" xml:space="preserve">6</text><text x="350" y="85" font-size="18" fill="#24364b" xml:space="preserve">Reshape：3×2</text><rect x="350" y="105" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="359" y="138.8" font-size="16" fill="#24364b" xml:space="preserve">1</text><rect x="402" y="105" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="411" y="138.8" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="350" y="157" width="52" height="52" fill="#d9e9ff" stroke="white" stroke-width="2"/><text x="359" y="190.8" font-size="16" fill="#24364b" xml:space="preserve">3</text><rect x="402" y="157" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="411" y="190.8" font-size="16" fill="#24364b" xml:space="preserve">4</text><rect x="350" y="209" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="359" y="242.8" font-size="16" fill="#24364b" xml:space="preserve">5</text><rect x="402" y="209" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="411" y="242.8" font-size="16" fill="#24364b" xml:space="preserve">6</text><text x="690" y="85" font-size="18" fill="#24364b" xml:space="preserve">Transpose：3×2</text><rect x="690" y="105" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="699" y="138.8" font-size="16" fill="#24364b" xml:space="preserve">1</text><rect x="742" y="105" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="751" y="138.8" font-size="16" fill="#24364b" xml:space="preserve">4</text><rect x="690" y="157" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="699" y="190.8" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="742" y="157" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="751" y="190.8" font-size="16" fill="#24364b" xml:space="preserve">5</text><rect x="690" y="209" width="52" height="52" fill="#d9e9ff" stroke="white" stroke-width="2"/><text x="699" y="242.8" font-size="16" fill="#24364b" xml:space="preserve">3</text><rect x="742" y="209" width="52" height="52" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="751" y="242.8" font-size="16" fill="#24364b" xml:space="preserve">6</text><path d="M180 140 L340 140" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="260.0" y="128" font-size="16" text-anchor="middle">保留线性次序</text><path d="M100 220 V300 H740 V267" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="326" font-size="18" fill="#24364b" xml:space="preserve">交换坐标 (i,j) → (j,i)</text><text x="24" y="358" font-size="17" fill="#24364b" xml:space="preserve">蓝色追踪元素 3；这里比较逻辑元素对应，不规定物理复制。</text></g></svg>
