<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">向量尾块：参与计算的 lane 不一定参与访存</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">向量尾块：参与计算的 lane 不一定参与访存</text><text x="25" y="115" font-size="18" fill="#24364b" xml:space="preserve">逻辑位置</text><rect x="255" y="80" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="264" y="119.0" font-size="16" fill="#24364b" xml:space="preserve">8</text><rect x="315" y="80" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="324" y="119.0" font-size="16" fill="#24364b" xml:space="preserve">9</text><rect x="375" y="80" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="384" y="119.0" font-size="16" fill="#24364b" xml:space="preserve">10</text><rect x="435" y="80" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="444" y="119.0" font-size="16" fill="#24364b" xml:space="preserve">11</text><text x="25" y="179" font-size="18" fill="#24364b" xml:space="preserve">读取得到</text><rect x="255" y="144" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="264" y="183.0" font-size="16" fill="#24364b" xml:space="preserve">8</text><rect x="315" y="144" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="324" y="183.0" font-size="16" fill="#24364b" xml:space="preserve">9</text><rect x="375" y="144" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="384" y="183.0" font-size="16" fill="#24364b" xml:space="preserve">0</text><rect x="435" y="144" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="444" y="183.0" font-size="16" fill="#24364b" xml:space="preserve">0</text><text x="25" y="243" font-size="18" fill="#24364b" xml:space="preserve">2 × (x + 1)</text><rect x="255" y="208" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="264" y="247.0" font-size="16" fill="#24364b" xml:space="preserve">18</text><rect x="315" y="208" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="324" y="247.0" font-size="16" fill="#24364b" xml:space="preserve">20</text><rect x="375" y="208" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="384" y="247.0" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="435" y="208" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="444" y="247.0" font-size="16" fill="#24364b" xml:space="preserve">2</text><text x="25" y="307" font-size="18" fill="#24364b" xml:space="preserve">写回目标</text><rect x="255" y="272" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="264" y="311.0" font-size="16" fill="#24364b" xml:space="preserve">y[8]</text><rect x="315" y="272" width="60" height="60" fill="#d9f1e4" stroke="white" stroke-width="2"/><text x="324" y="311.0" font-size="16" fill="#24364b" xml:space="preserve">y[9]</text><rect x="375" y="272" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="384" y="311.0" font-size="16" fill="#24364b" xml:space="preserve">不写</text><rect x="435" y="272" width="60" height="60" fill="#ffe9c7" stroke="white" stroke-width="2"/><text x="444" y="311.0" font-size="16" fill="#24364b" xml:space="preserve">不写</text><rect x="575" y="110" width="350" height="165" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="589" y="139" font-size="18" fill="#24364b" xml:space="preserve">长度 10，从位置 8 开始</text><text x="589" y="165" font-size="18" fill="#24364b" xml:space="preserve">有效：lane 0、1</text><text x="589" y="191" font-size="18" fill="#24364b" xml:space="preserve">越界：lane 2、3</text><text x="589" y="217" font-size="18" fill="#24364b" xml:space="preserve">后两项从 padding 得到</text><text x="589" y="243" font-size="18" fill="#24364b" xml:space="preserve">计算后仍屏蔽写出</text><text x="24" y="384" font-size="16" fill="#24364b" xml:space="preserve">补值保护读访问，屏蔽保护写访问；后续若做归约，还要检查无效 lane 的数值贡献。</text></g></svg>
