<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">linalg.generic：一次迭代如何连接输入、主体与输出</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">linalg.generic：一次迭代如何连接输入、主体与输出</text><rect x="24" y="75" width="900" height="60" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="104" font-size="18" fill="#24364b" xml:space="preserve">迭代坐标 (i,j) = (1,2)；本例三个 indexing map 都是 (i,j) → (i,j)</text><rect x="24" y="185" width="270" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="214" font-size="18" fill="#24364b" xml:space="preserve">ins：A[1,2] = 6</text><text x="38" y="240" font-size="18" fill="#24364b" xml:space="preserve">→ %x = 6</text><rect x="340" y="185" width="270" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="354" y="214" font-size="18" fill="#24364b" xml:space="preserve">ins：B[1,2] = 60</text><text x="354" y="240" font-size="18" fill="#24364b" xml:space="preserve">→ %y = 60</text><rect x="655" y="185" width="270" height="80" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="669" y="214" font-size="18" fill="#24364b" xml:space="preserve">outs：旧目的元素</text><text x="669" y="240" font-size="18" fill="#24364b" xml:space="preserve">→ %unused（本例不读）</text><path d="M159 135 L159 185" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="169.0" y="151.0" font-size="16" fill="#24364b" xml:space="preserve">map 选元素</text><path d="M475 135 L475 185" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="151.0" font-size="16" fill="#24364b" xml:space="preserve">map 选元素</text><path d="M790 135 L790 185" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="800.0" y="151.0" font-size="16" fill="#24364b" xml:space="preserve">map 选元素</text><rect x="160" y="330" width="445" height="80" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="174" y="359" font-size="18" fill="#24364b" xml:space="preserve">主体：%sum = addf %x, %y = 66</text><text x="174" y="385" font-size="18" fill="#24364b" xml:space="preserve">linalg.yield %sum</text><path d="M159 265 L270 330" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 265 L490 330" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="330" width="245" height="80" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="359" font-size="18" fill="#24364b" xml:space="preserve">结果 tensor</text><text x="694" y="385" font-size="18" fill="#24364b" xml:space="preserve">%r[1,2] = 66</text><path d="M605 370 L680 370" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="462" font-size="17" fill="#24364b" xml:space="preserve">输出 map 选择结果位置；yield 提供该位置的新元素。Block 参数不是循环索引。</text></g></svg>
