<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">CSR：逻辑列号与存储条目编号是两套索引</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">CSR：逻辑列号与存储条目编号是两套索引</text><text x="25" y="85" font-size="18" fill="#24364b" xml:space="preserve">逻辑 A</text><rect x="25" y="100" width="55" height="55" fill="#d9e9ff" stroke="white" stroke-width="2"/><text x="34" y="135.75" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="80" y="100" width="55" height="55" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="89" y="135.75" font-size="16" fill="#24364b" xml:space="preserve">0</text><rect x="135" y="100" width="55" height="55" fill="#d9e9ff" stroke="white" stroke-width="2"/><text x="144" y="135.75" font-size="16" fill="#24364b" xml:space="preserve">3</text><rect x="25" y="155" width="55" height="55" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="34" y="190.75" font-size="16" fill="#24364b" xml:space="preserve">0</text><rect x="80" y="155" width="55" height="55" fill="#d9e9ff" stroke="white" stroke-width="2"/><text x="89" y="190.75" font-size="16" fill="#24364b" xml:space="preserve">4</text><rect x="135" y="155" width="55" height="55" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="144" y="190.75" font-size="16" fill="#24364b" xml:space="preserve">0</text><rect x="280" y="100" width="650" height="90" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="294" y="129" font-size="18" fill="#24364b" xml:space="preserve">positions = [0, 2, 3]</text><text x="294" y="155" font-size="18" fill="#24364b" xml:space="preserve">第 0 行：条目 p ∈ [0,2)；第 1 行：p ∈ [2,3)</text><text x="280" y="240" font-size="18" fill="#24364b" xml:space="preserve">条目 p</text><text x="280" y="286" font-size="18" fill="#24364b" xml:space="preserve">列号 coordinates[p]</text><text x="280" y="332" font-size="18" fill="#24364b" xml:space="preserve">数值 values[p]</text><rect x="580" y="211" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="589" y="240.9" font-size="16" fill="#24364b" xml:space="preserve">0</text><rect x="626" y="211" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="635" y="240.9" font-size="16" fill="#24364b" xml:space="preserve">1</text><rect x="672" y="211" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="681" y="240.9" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="580" y="257" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="589" y="286.9" font-size="16" fill="#24364b" xml:space="preserve">0</text><rect x="626" y="257" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="635" y="286.9" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="672" y="257" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="681" y="286.9" font-size="16" fill="#24364b" xml:space="preserve">1</text><rect x="580" y="303" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="589" y="332.9" font-size="16" fill="#24364b" xml:space="preserve">2</text><rect x="626" y="303" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="635" y="332.9" font-size="16" fill="#24364b" xml:space="preserve">3</text><rect x="672" y="303" width="46" height="46" fill="#f0f3f7" stroke="white" stroke-width="2"/><text x="681" y="332.9" font-size="16" fill="#24364b" xml:space="preserve">4</text><text x="25" y="390" font-size="18" fill="#24364b" xml:space="preserve">例如 p=1 对应 A[0,2]=3；乘向量时读 x[2]，而不是 x[1]。</text></g></svg>
