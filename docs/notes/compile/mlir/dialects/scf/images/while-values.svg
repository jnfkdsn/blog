<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">scf.while 的两条传值路径</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">scf.while 的两条传值路径</text><rect x="24" y="80" width="200" height="65" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="109" font-size="18" fill="#24364b" xml:space="preserve">初始 operands</text><rect x="315" y="80" width="290" height="75" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="329" y="109" font-size="18" fill="#24364b" xml:space="preserve">before：入口参数</text><text x="329" y="135" font-size="18" fill="#24364b" xml:space="preserve">执行判断前的计算</text><path d="M224 112 L315 112" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="315" y="210" width="290" height="75" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="329" y="239" font-size="18" fill="#24364b" xml:space="preserve">scf.condition</text><text x="329" y="265" font-size="18" fill="#24364b" xml:space="preserve">条件 + 要传出的值</text><path d="M460 155 L460 210" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="210" width="245" height="75" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="704" y="239" font-size="18" fill="#24364b" xml:space="preserve">while 的 results</text><text x="704" y="265" font-size="18" fill="#24364b" xml:space="preserve">循环结束</text><path d="M605 247 L690 247" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="647.5" y="235" font-size="16" text-anchor="middle">false</text><rect x="315" y="365" width="290" height="85" rx="8" fill="#eee8fc" stroke="#8a9cb2" stroke-width="1.5"/><text x="329" y="394" font-size="18" fill="#24364b" xml:space="preserve">after：入口参数</text><text x="329" y="420" font-size="18" fill="#24364b" xml:space="preserve">执行主体 → scf.yield</text><path d="M460 285 L460 365" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="470.0" y="316.0" font-size="16" fill="#24364b" xml:space="preserve">true</text><path d="M315 408 H265 V118 H315" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="320" font-size="18" fill="#24364b" xml:space="preserve">yield 的值送回</text><text x="30" y="346" font-size="18" fill="#24364b" xml:space="preserve">before 参数</text><text x="24" y="482" font-size="16" fill="#24364b" xml:space="preserve">condition 的传出值同时匹配 after 参数与结果类型；yield 匹配 before 参数类型。</text></g></svg>
