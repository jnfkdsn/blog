<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-labelledby="title desc">
<title id="title">融合后的两个输出共用同一局部值</title><desc id="desc">a 写入 buf0，又被乘法直接使用，乘积写入 buf1。</desc>
<defs><marker id="tip" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#465d71" stroke-width="1.7"/></marker></defs>
<rect x="1" y="1" width="618" height="178" rx="8" fill="#fafbfd" stroke="#ccd5df"/>
<g font-family="system-ui, sans-serif" fill="#182c42">
<rect x="12" y="68" width="187" height="41" rx="5" fill="#e3edf8" stroke="#8293a3"/>
<text x="105.5" y="94.5" font-size="16" text-anchor="middle" font-weight="400">a = relu(x[p] + y[p])</text>
<rect x="266" y="26" width="141" height="42" rx="5" fill="#fff0d8" stroke="#8293a3"/>
<text x="336.5" y="53.0" font-size="17" text-anchor="middle" font-weight="400">直接写 a</text>
<rect x="266" y="110" width="141" height="42" rx="5" fill="#daf0e7" stroke="#8293a3"/>
<text x="336.5" y="137.0" font-size="17" text-anchor="middle" font-weight="400">a × z[p]</text>
<rect x="462" y="26" width="142" height="42" rx="5" fill="#fff0d8" stroke="#8293a3"/>
<text x="533.0" y="53.0" font-size="17" text-anchor="middle" font-weight="400">buf0[p]</text>
<rect x="462" y="110" width="142" height="42" rx="5" fill="#fff0d8" stroke="#8293a3"/>
<text x="533.0" y="137.0" font-size="17" text-anchor="middle" font-weight="400">buf1[p]</text>
<path d="M199 88 H224 V47 H263" fill="none" stroke="#465d71" stroke-width="1.8" marker-end="url(#tip)"/>
<path d="M224 88 V131 H263" fill="none" stroke="#465d71" stroke-width="1.8" marker-end="url(#tip)"/>
<path d="M407 47 H459" fill="none" stroke="#465d71" stroke-width="1.8" marker-end="url(#tip)"/>
<path d="M407 131 H459" fill="none" stroke="#465d71" stroke-width="1.8" marker-end="url(#tip)"/>
</g></svg>
