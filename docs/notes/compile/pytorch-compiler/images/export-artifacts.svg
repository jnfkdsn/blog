<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">导出程序描述与编译部署产物</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">导出程序描述与编译部署产物</text><rect x="24" y="80" width="270" height="110" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="109" font-size="18" fill="#24364b" xml:space="preserve">模型与输入约束</text><text x="38" y="135" font-size="18" fill="#24364b" xml:space="preserve">x:[B,7]，B∈[2,8]</text><text x="38" y="161" font-size="18" fill="#24364b" xml:space="preserve">weight:[7,3]，bias:[3]</text><rect x="355" y="80" width="250" height="110" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="369" y="109" font-size="18" fill="#24364b" xml:space="preserve">ExportedProgram</text><text x="369" y="135" font-size="18" fill="#24364b" xml:space="preserve">图、状态、签名</text><text x="369" y="161" font-size="18" fill="#24364b" xml:space="preserve">形状约束</text><path d="M294 133 L355 133" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="324.5" y="121" font-size="16" text-anchor="middle">export</text><rect x="680" y="80" width="250" height="110" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="109" font-size="18" fill="#24364b" xml:space="preserve">AOTInductor 包</text><text x="694" y="135" font-size="18" fill="#24364b" xml:space="preserve">目标代码</text><text x="694" y="161" font-size="18" fill="#24364b" xml:space="preserve">运行所需元数据</text><path d="M605 133 L680 133" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="642.5" y="121" font-size="16" text-anchor="middle">编译</text><rect x="355" y="290" width="575" height="85" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="369" y="319" font-size="18" fill="#24364b" xml:space="preserve">服务进程：加载编译包 → 输入合法数据 → 调用 → 输出 [B,3]</text><path d="M805 190 L805 290" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="815.0" y="231.0" font-size="16" fill="#24364b" xml:space="preserve">交付</text><text x="24" y="410" font-size="17" fill="#24364b" xml:space="preserve">ExportedProgram 保存图与约束；AOTInductor 将其编译为可加载的目标产物。</text></g></svg>
