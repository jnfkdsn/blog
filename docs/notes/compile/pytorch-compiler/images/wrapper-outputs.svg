<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">wrapper 准备两个输出，融合内核写入两份结果</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">wrapper 准备两个输出，融合内核写入两份结果</text><rect x="24" y="75" width="900" height="320" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="104" font-size="18" fill="#24364b" xml:space="preserve">一次运行时调用：wrapper(x,y,z)</text><rect x="45" y="140" width="250" height="110" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="59" y="169" font-size="18" fill="#24364b" xml:space="preserve">准备 out_a、out_r</text><text x="59" y="195" font-size="18" fill="#24364b" xml:space="preserve">两份输出存储</text><text x="59" y="221" font-size="18" fill="#24364b" xml:space="preserve">并传入输入与输出参数</text><rect x="375" y="140" width="260" height="160" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="389" y="169" font-size="18" fill="#24364b" xml:space="preserve">已编译内核</text><text x="389" y="195" font-size="18" fill="#24364b" xml:space="preserve">a = relu(x+y)</text><text x="389" y="221" font-size="18" fill="#24364b" xml:space="preserve">r = a*z</text><text x="389" y="247" font-size="18" fill="#24364b" xml:space="preserve">store a → out_a</text><text x="389" y="273" font-size="18" fill="#24364b" xml:space="preserve">store r → out_r</text><rect x="710" y="140" width="190" height="110" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="724" y="169" font-size="18" fill="#24364b" xml:space="preserve">返回张量</text><text x="724" y="195" font-size="18" fill="#24364b" xml:space="preserve">(out_a, out_r)</text><path d="M295 190 L375 190" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 190 L710 190" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="355" font-size="17" fill="#24364b" xml:space="preserve">a 可在内核中直接用于计算 r，同时仍须写入 out_a，因为调用者会读取它。</text><text x="24" y="439" font-size="18" fill="#24364b" xml:space="preserve">编译和装载先准备可调用实现；图中这次调用才读取本次输入并写结果。</text></g></svg>
