<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">torch.compile：检查已有版本，再决定执行或编译</title><desc id="desc">原创教学示意图。箭头和边界的具体含义见图内标注与正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b87"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#24364b"><text x="28" y="36" font-size="23" fill="#24364b" xml:space="preserve">torch.compile：检查已有版本，再决定执行或编译</text><rect x="24" y="85" width="220" height="80" rx="8" fill="#f0f3f7" stroke="#8a9cb2" stroke-width="1.5"/><text x="38" y="114" font-size="18" fill="#24364b" xml:space="preserve">应用传入输入</text><text x="38" y="140" font-size="18" fill="#24364b" xml:space="preserve">x、参数等</text><rect x="330" y="85" width="250" height="80" rx="8" fill="#d9e9ff" stroke="#8a9cb2" stroke-width="1.5"/><text x="344" y="114" font-size="18" fill="#24364b" xml:space="preserve">Dynamo 检查 guards</text><text x="344" y="140" font-size="18" fill="#24364b" xml:space="preserve">已有版本是否适用？</text><path d="M244 125 L330 125" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="85" width="250" height="80" rx="8" fill="#d9f1e4" stroke="#8a9cb2" stroke-width="1.5"/><text x="694" y="114" font-size="18" fill="#24364b" xml:space="preserve">执行适用的</text><text x="694" y="140" font-size="18" fill="#24364b" xml:space="preserve">已编译版本</text><path d="M580 125 L680 125" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="630.0" y="113" font-size="16" text-anchor="middle">成立</text><rect x="330" y="280" width="250" height="95" rx="8" fill="#ffe9c7" stroke="#8a9cb2" stroke-width="1.5"/><text x="344" y="309" font-size="18" fill="#24364b" xml:space="preserve">无适用版本时</text><text x="344" y="335" font-size="18" fill="#24364b" xml:space="preserve">捕获与后端编译</text><text x="344" y="361" font-size="18" fill="#24364b" xml:space="preserve">生成代码及适用条件</text><path d="M455 165 L455 280" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="465.0" y="213.5" font-size="16" fill="#24364b" xml:space="preserve">不成立</text><path d="M580 326 H806 V165" fill="none" stroke="#536b87" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="416" font-size="17" fill="#24364b" xml:space="preserve">这是默认编译路径的简图；graph break、缓存限制及回退行为见后续章节。</text></g></svg>
